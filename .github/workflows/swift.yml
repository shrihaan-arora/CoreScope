name: Swift CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Deterministic Tests
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Verify zero external SwiftPM dependencies
      run: |
        grep -F 'dependencies: []' Package.swift || {
          echo "ERROR: CoreScope must have zero external dependencies." >&2
          exit 1
        }

    - name: Build CoreScope (Debug)
      run: swift build -v

    - name: Build CoreScope (Release)
      run: swift build -c release -v

    - name: Run Deterministic Unit Tests
      run: swift test -v

    - name: Verify Standalone Packaging Script
      run: ./scripts/package-app.sh
